name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-nba-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nba-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/nba-engine/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v
